<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1" fill="#e8edf4"/></pattern>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8994a6"/></marker>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#1b2a41" flood-opacity=".10"/></filter>
  <style>
  .card{fill:#fff;stroke:#cbd5e1;stroke-width:2;rx:16;filter:url(#shadow)}
  .label{font:600 18px Inter,Segoe UI,Arial,sans-serif;fill:#243247;text-anchor:middle}
  .sub{font:14px Inter,Segoe UI,Arial,sans-serif;fill:#718096;text-anchor:middle}
  .line{fill:none;stroke:#8994a6;stroke-width:3;marker-end:url(#arrow)}
  .node{fill:#f6f8fb;stroke:#b8c3d2;stroke-width:2}
  </style>
</defs>
<rect width="1600" height="900" fill="#fbfcfe"/><rect width="1600" height="900" fill="url(#dots)"/>
<text x="800" y="50" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="26" font-weight="700" fill="#27364b" text-anchor="middle">CLINPATH AI · FULL PROGRAM WORKFLOW WITH DATASETS</text>
<text x="800" y="78" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#738197" text-anchor="middle">Selected specialty → one case → patient simulation → learner review</text>
<!-- main path -->
<path class="line" d="M190 270H270"/><path class="line" d="M430 270H510"/><path class="line" d="M700 270H780"/><path class="line" d="M970 270H1050"/><path class="line" d="M1240 270H1320"/>
<!-- browser -->
<rect class="card" x="40" y="210" width="150" height="120"/>
<circle cx="115" cy="250" r="24" fill="#e9f1ff"/><path d="M97 250h36M115 232v36" stroke="#4d7bd6" stroke-width="4" stroke-linecap="round"/>
<text class="label" x="115" y="297">Open app</text><text class="sub" x="115" y="318">HTML · CSS · JS</text>
<!-- status -->
<rect class="card" x="270" y="210" width="160" height="120"/>
<circle cx="350" cy="250" r="23" fill="#edf7f1"/><path d="M339 250l8 8 15-18" fill="none" stroke="#27a36a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<text class="label" x="350" y="297">Check server</text><text class="sub" x="350" y="318">GET /api/status</text>
<!-- choose -->
<rect class="card" x="510" y="210" width="190" height="120"/>
<circle cx="605" cy="250" r="23" fill="#f2edff"/><path d="M592 244h26M592 250h20M592 256h14" stroke="#7557bd" stroke-width="3" stroke-linecap="round"/>
<text class="label" x="605" y="297">Choose specialty</text><text class="sub" x="605" y="318">+ support level</text>
<!-- start session -->
<rect class="card" x="780" y="210" width="190" height="120"/>
<circle cx="875" cy="250" r="23" fill="#fff4e8"/><path d="M867 238l18 12-18 12z" fill="#da8a32"/>
<text class="label" x="875" y="297">Start session</text><text class="sub" x="875" y="318">POST /api/start-session</text>
<!-- dataset lookup -->
<rect x="1050" y="195" width="190" height="150" rx="18" fill="#f3f9ff" stroke="#83aad7" stroke-width="2.5" filter="url(#shadow)"/>
<circle cx="1145" cy="235" r="23" fill="#e1efff"/><path d="M1134 226h22v20h-22zM1134 231h22M1140 222v8M1150 222v8" fill="none" stroke="#3976b9" stroke-width="2.5"/>
<text class="label" x="1145" y="280">Load one case</text><text class="sub" x="1145" y="302">Selected specialty’s</text><text class="sub" x="1145" y="322">dataset → session</text>
<!-- case sent -->
<rect class="card" x="1320" y="210" width="230" height="120"/>
<circle cx="1435" cy="250" r="23" fill="#e9f8f5"/><path d="M1424 250h22M1437 241l9 9-9 9" fill="none" stroke="#299b83" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text class="label" x="1435" y="297">Create patient case</text><text class="sub" x="1435" y="318">facts + opening + vitals</text>
<!-- branch to dataset files -->
<path class="line" d="M1145 345V430H800"/><path class="line" d="M800 430V470"/>
<text x="972" y="420" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" fill="#708096">lookup by chosen specialty</text>
<rect x="360" y="470" width="880" height="115" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
<text x="800" y="500" class="label">Five specialty workbooks · only the selected specialty is queried</text>
<g font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" text-anchor="middle">
<rect x="390" y="520" width="155" height="42" rx="10" fill="#f7f8fb" stroke="#dde3eb"/><text x="467" y="546" fill="#405069">Cardiology.xlsx</text>
<rect x="555" y="520" width="155" height="42" rx="10" fill="#f7f8fb" stroke="#dde3eb"/><text x="632" y="546" fill="#405069">Neurology.xlsx</text>
<rect x="720" y="520" width="155" height="42" rx="10" fill="#f7f8fb" stroke="#dde3eb"/><text x="797" y="546" fill="#405069">Psychiatry.xlsx</text>
<rect x="885" y="520" width="155" height="42" rx="10" fill="#f7f8fb" stroke="#dde3eb"/><text x="962" y="546" fill="#405069">Pulmonology.xlsx</text>
<rect x="1050" y="520" width="155" height="42" rx="10" fill="#f7f8fb" stroke="#dde3eb"/><text x="1127" y="546" fill="#405069">Gastroenterology.xlsx</text>
</g>
<!-- interaction loop -->
<path class="line" d="M1435 330V620H1240"/><path class="line" d="M1050 680H950"/><path class="line" d="M760 680H660"/><path class="line" d="M470 680H370"/>
<rect class="card" x="1240" y="620" width="210" height="120"/><circle cx="1345" cy="657" r="22" fill="#edf4ff"/><path d="M1334 649h22v16h-22zM1338 670h14" fill="none" stroke="#4d7bd6" stroke-width="2.5"/>
<text class="label" x="1345" y="704">Learner interview</text><text class="sub" x="1345" y="725">questions to patient</text>
<rect class="card" x="760" y="620" width="190" height="120"/><circle cx="855" cy="657" r="22" fill="#f2edff"/><path d="M845 650h20v15h-20zM850 670h10" fill="none" stroke="#7557bd" stroke-width="2.5"/>
<text class="label" x="855" y="704">Patient replies</text><text class="sub" x="855" y="725">POST /api/patient</text>
<rect class="card" x="470" y="620" width="190" height="120"/><circle cx="565" cy="657" r="22" fill="#fff4e8"/><path d="M555 648h20v18h-20zM559 653h12M559 658h12" fill="none" stroke="#da8a32" stroke-width="2.5"/>
<text class="label" x="565" y="704">Hints (optional)</text><text class="sub" x="565" y="725">POST /api/hint</text>
<rect class="card" x="180" y="620" width="190" height="120"/><circle cx="275" cy="657" r="22" fill="#edf7f1"/><path d="M265 658l7 7 14-16" fill="none" stroke="#27a36a" stroke-width="3" stroke-linecap="round"/>
<text class="label" x="275" y="704">Submit assessment</text><text class="sub" x="275" y="725">observations + diagnosis</text>
<path class="line" d="M275 620V790H520"/>
<rect x="520" y="790" width="560" height="70" rx="16" fill="#eef8f5" stroke="#8fcaba" stroke-width="2" filter="url(#shadow)"/>
<text class="label" x="800" y="820">Evaluate against selected case → feedback + progress</text><text class="sub" x="800" y="843">POST /api/evaluate · review · practice another case</text>
<text x="40" y="875" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" fill="#8792a2">Dataset connection shown as the intended integration flow; the current code still generates cases from specialty condition lists.</text>
</svg>
